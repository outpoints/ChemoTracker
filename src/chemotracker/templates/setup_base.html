{% extends "base.html" %}
{% block shell %}
{% from "_ui.html" import icon %}
<div class="setup">
  <div class="setup-top">
    <span class="brand"><img class="brand-mark" src="/static/icon.svg" alt="">ChemoTracker</span>
    {% if step %}
    <span class="steps" aria-label="Step {{ step }} of 4">{% for i in range(1, 5) %}<i class="{{ 'on' if i == step else ('done' if i < step) }}"></i>{% endfor %}</span>
    {% endif %}
  </div>
  {% include "_flash.html" %}
  {% block setup %}{% endblock %}
</div>
{% endblock %}
