name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Personal information check (generic rules; the private list never leaves the owner's machine)
        run: |
          python3 scripts/check_pii.py --all
          python3 scripts/check_pii.py --history
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
      - name: Tests
        run: |
          uv sync --frozen
          uv run pytest -q
      - name: Known vulnerabilities in the locked packages
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx --from "pip-audit==2.10.1" pip-audit -r /tmp/requirements.txt --require-hashes --disable-pip
