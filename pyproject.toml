[project]
name = "chemotracker"
version = "0.1.0"
description = "Self-hosted chemotherapy supportive-medication tracker with Excel/CSV reports for the care team."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "itsdangerous>=2.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
chemotracker = "chemotracker.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemotracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
